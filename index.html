<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAVEX-STUDIO DAW</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #121418;
      color: #d1d5db;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .fl-rack-row {
      background: linear-gradient(180deg, #252a34 0%, #1a1d24 100%);
      border: 1px solid #323846;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.5);
    }
    .fl-pad {
      background: linear-gradient(180deg, #323846 0%, #222630 100%);
      border: 1px solid #181a20;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .fl-pad.active-kick {
      background: linear-gradient(180deg, #00ff66 0%, #00993d 100%) !important;
      border-color: #00ff66 !important;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.7), inset 0 1px 1px #fff !important;
    }
    .fl-pad.active-snare {
      background: linear-gradient(180deg, #00d9ff 0%, #0077b3 100%) !important;
      border-color: #00d9ff !important;
      box-shadow: 0 0 12px rgba(0, 217, 255, 0.7), inset 0 1px 1px #fff !important;
    }
    .fl-pad.active-hat {
      background: linear-gradient(180deg, #ff0077 0%, #990047 100%) !important;
      border-color: #ff0077 !important;
      box-shadow: 0 0 12px rgba(255, 0, 119, 0.7), inset 0 1px 1px #fff !important;
    }
    .fl-pad.active-clap {
      background: linear-gradient(180deg, #ffaa00 0%, #996600 100%) !important;
      border-color: #ffaa00 !important;
      box-shadow: 0 0 12px rgba(255, 170, 0, 0.7), inset 0 1px 1px #fff !important;
    }
    .step-current {
      border: 2px solid #ffffff !important;
      filter: brightness(1.3);
    }
    .knob-dial {
      background: radial-gradient(circle at 30% 30%, #4b5563, #1f2937);
      border: 1px solid #111827;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.2), 0 2px 4px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body class="p-3 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <div>
    <!-- FL Studio Top Control Bar -->
    <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl mb-3 flex items-center justify-between shadow-2xl">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
        <span class="text-xs font-black tracking-widest text-white">WAVEX<span class="text-emerald-400"> STUDIO</span></span>
      </div>
      <button id="playBtn" class="bg-emerald-500 hover:bg-emerald-400 text-black font-black text-xs px-5 py-2 rounded-lg shadow-lg shadow-emerald-500/20 active:scale-95 transition">
        ▶ PLAY
      </button>
    </div>

    <!-- FL View Navigation Tabs -->
    <div class="grid grid-cols-4 gap-1 p-1 bg-zinc-950 border border-zinc-800 rounded-lg mb-3 text-[10px] font-black text-zinc-400">
      <button class="py-1.5 rounded bg-zinc-800 text-emerald-400 border border-emerald-500/30 text-center">RACK</button>
      <button class="py-1.5 rounded bg-zinc-900/50 hover:text-white text-center">PIANO</button>
      <button class="py-1.5 rounded bg-zinc-900/50 hover:text-white text-center">PLAYLIST</button>
      <button class="py-1.5 rounded bg-zinc-900/50 hover:text-white text-center">MIXER</button>
    </div>

    <!-- Tempo & Master Controls -->
    <div class="bg-zinc-900/80 border border-zinc-800 p-2.5 rounded-xl flex items-center justify-between gap-3 mb-4">
      <div class="flex items-center gap-2 bg-black/60 px-3 py-1 rounded-lg border border-zinc-800">
        <span class="text-[10px] font-bold text-zinc-500">TEMPO</span>
        <input id="bpmInput" type="number" value="125" class="bg-transparent text-emerald-400 font-bold w-10 text-center text-xs focus:outline-none">
        <span class="text-[9px] text-zinc-500 font-bold">BPM</span>
      </div>
      <div class="flex items-center gap-2 flex-1">
        <span class="text-[10px] font-bold text-zinc-500">MASTER</span>
        <input id="volInput" type="range" min="0" max="1" step="0.05" value="0.8" class="w-full accent-emerald-400 h-1 bg-zinc-800 rounded-lg">
      </div>
    </div>

    <!-- Channel Rack Section -->
    <div class="flex justify-between items-center mb-2 px-1">
      <span class="text-[10px] font-black tracking-widest text-zinc-400">CHANNEL RACK</span>
      <span class="text-[9px] font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-2 py-0.5 rounded-full">8 STEP SEQUENCER</span>
    </div>

    <!-- Rack Rows -->
    <div id="rack" class="space-y-2"></div>
  </div>

  <div class="text-center text-[10px] text-zinc-600 font-semibold my-3">
    WAVEX-STUDIO • Authentic Sound Engine
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let ctx = null;
    let isPlaying = false;
    let currentStep = 0;
    let intervalId = null;

    const tracks = [
      { name: "Kick Drum", type: "kick", activeClass: "active-kick", tagColor: "bg-emerald-500" },
      { name: "Snare Drum", type: "snare", activeClass: "active-snare", tagColor: "bg-cyan-500" },
      { name: "Hi-Hat Closed", type: "hat", activeClass: "active-hat", tagColor: "bg-pink-500" },
      { name: "Clap", type: "clap", activeClass: "active-clap", tagColor: "bg-amber-500" }
    ];

    const sequence = tracks.map(() => Array(8).fill(false));

    function initCtx() {
      if (!ctx) ctx = new AudioCtx();
      if (ctx.state === 'suspended') ctx.resume();
    }

    // Authentic Synthesis Engine
    function playSound(type) {
      if (!ctx) return;
      const masterVol = parseFloat(document.getElementById('volInput').value);
      const now = ctx.currentTime;

      if (type === 'kick') {
        // Kick Pitch Sweep
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(masterVol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } 
      else if (type === 'snare') {
        // Snare Noise + Body Oscillator
        const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.value = 800;

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(masterVol * 0.8, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        whiteNoise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(ctx.destination);

        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
        oscGain.gain.setValueAtTime(masterVol, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

        osc.connect(oscGain);
        oscGain.connect(ctx.destination);

        whiteNoise.start(now);
        osc.start(now);
        whiteNoise.stop(now + 0.15);
        osc.stop(now + 0.1);
      } 
      else if (type === 'hat') {
        // Metallic High-Pass Noise Burst
        const bufferSize = ctx.sampleRate * 0.05;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const source = ctx.createBufferSource();
        source.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 8000;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(masterVol * 0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        source.start(now);
      } 
      else if (type === 'clap') {
        // Multi-Burst Echo Clap
        const bufferSize = ctx.sampleRate * 0.12;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const source = ctx.createBufferSource();
        source.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1200;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(masterVol, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        source.start(now);
      }
    }

    function renderRack() {
      const rackEl = document.getElementById('rack');
      rackEl.innerHTML = '';

      tracks.forEach((track, tIdx) => {
        const row = document.createElement('div');
        row.className = 'fl-rack-row p-2 rounded-xl flex items-center justify-between gap-2';

        // Track Name & Channel Knobs
        const trackMeta = document.createElement('div');
        trackMeta.className = 'w-24 flex items-center gap-1.5';
        trackMeta.innerHTML = `
          <div class="w-1.5 h-6 rounded-full ${track.tagColor}"></div>
          <div class="flex flex-col">
            <span class="text-[10px] font-bold text-white leading-tight truncate">${track.name}</span>
            <div class="flex gap-1 items-center mt-0.5">
              <div class="knob-dial w-3 h-3 rounded-full"></div>
              <span class="text-[8px] font-bold text-zinc-500">VOL</span>
              <div class="knob-dial w-3 h-3 rounded-full"></div>
              <span class="text-[8px] font-bold text-zinc-500">PAN</span>
            </div>
          </div>
        `;
        row.appendChild(trackMeta);

        // 8 Steps Grid
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-8 gap-1 flex-1';

        for (let sIdx = 0; sIdx < 8; sIdx++) {
          const btn = document.createElement('button');
          btn.className = `fl-pad h-8 rounded transition-all ${sequence[tIdx][sIdx] ? track.activeClass : ''}`;
          
          if (currentStep === sIdx && isPlaying) {
            btn.classList.add('step-current');
          }

          btn.onclick = () => {
            initCtx();
            sequence[tIdx][sIdx] = !sequence[tIdx][sIdx];
            if (sequence[tIdx][sIdx]) playSound(track.type);
            renderRack();
          };
          grid.appendChild(btn);
        }
        row.appendChild(grid);
        rackEl.appendChild(row);
      });
    }

    document.getElementById('playBtn').onclick = () => {
      initCtx();
      isPlaying = !isPlaying;
      const playBtn = document.getElementById('playBtn');

      if (isPlaying) {
        playBtn.innerText = '■ STOP';
        playBtn.className = 'bg-rose-500 hover:bg-rose-600 text-white font-black text-xs px-5 py-2 rounded-lg shadow-lg shadow-rose-500/20 active:scale-95 transition';
        currentStep = 0;
        runSequencer();
      } else {
        playBtn.innerText = '▶ PLAY';
        playBtn.className = 'bg-emerald-500 hover:bg-emerald-400 text-black font-black text-xs px-5 py-2 rounded-lg shadow-lg shadow-emerald-500/20 active:scale-95 transition';
        clearInterval(intervalId);
        renderRack();
      }
    };

    function runSequencer() {
      const bpm = parseInt(document.getElementById('bpmInput').value) || 120;
      const stepTime = (60 / bpm / 2) * 1000;

      clearInterval(intervalId);
      intervalId = setInterval(() => {
        tracks.forEach((track, tIdx) => {
          if (sequence[tIdx][currentStep]) playSound(track.type);
        });
        renderRack();
        currentStep = (currentStep + 1) % 8;
      }, stepTime);
    }

    renderRack();
  </script>
</body>
</html>
