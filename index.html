<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAVEX-STUDIO DAW</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom FL Studio Theme Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="p-3 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <div>
    <!-- Top Transport & Branding -->
    <div class="fl-chassis p-3 rounded-2xl mb-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-amber-500 shadow-md shadow-amber-500/50 animate-pulse"></div>
        <span class="text-xs font-black tracking-widest text-white">WAVEX<span class="text-amber-500"> STUDIO</span></span>
      </div>
      <button id="playBtn" class="bg-gradient-to-r from-amber-500 to-orange-600 text-black font-black text-xs px-5 py-2 rounded-xl shadow-lg shadow-orange-500/20 active:scale-95 transition">
        ▶ PLAY
      </button>
    </div>

    <!-- View Navigation Tabs -->
    <div class="grid grid-cols-4 gap-1 p-1 bg-black/60 border border-zinc-800 rounded-xl mb-3 text-[10px] font-bold text-zinc-400">
      <button onclick="switchView('rack')" id="tab-rack" class="py-2 rounded-lg tab-active transition text-center">RACK</button>
      <button onclick="switchView('piano')" id="tab-piano" class="py-2 rounded-lg hover:text-white transition text-center">PIANO</button>
      <button onclick="switchView('playlist')" id="tab-playlist" class="py-2 rounded-lg hover:text-white transition text-center">PLAYLIST</button>
      <button onclick="switchView('mixer')" id="tab-mixer" class="py-2 rounded-lg hover:text-white transition text-center">MIXER</button>
    </div>

    <!-- Tempo & Master Controls -->
    <div class="fl-chassis p-2.5 rounded-2xl flex items-center justify-between gap-3 mb-4">
      <div class="flex items-center gap-2 bg-black/60 px-3 py-1.5 rounded-xl border border-zinc-800">
        <span class="text-[10px] font-extrabold text-zinc-400">TEMPO</span>
        <input id="bpmInput" type="number" value="125" class="bg-transparent text-amber-500 font-black w-10 text-center text-xs focus:outline-none">
        <span class="text-[9px] text-zinc-500 font-bold">BPM</span>
      </div>
      <div class="flex items-center gap-2 flex-1">
        <span class="text-[10px] font-extrabold text-zinc-400">MASTER</span>
        <input id="volInput" type="range" min="0" max="1" step="0.05" value="0.8" class="w-full accent-amber-500 h-1.5 bg-zinc-800 rounded-lg">
      </div>
    </div>

    <!-- Active Viewport Container -->
    <div id="viewport"></div>
  </div>

  <div class="text-center text-[10px] text-zinc-600 font-bold my-3">
    WAVEX-STUDIO • Modular Professional Architecture
  </div>

  <!-- Modular JS Script Controller -->
  <script src="app.js"></script>
</body>
</html>
