
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAVEX-STUDIO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #121212; color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    .active-step { background-color: #00FF66 !important; box-shadow: 0 0 10px #00FF66; }
    .current-step { border: 2px solid #FFFFFF !important; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <!-- Header & Transport -->
  <div>
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-xl font-extrabold tracking-wider text-emerald-400">WAVEX-STUDIO</h1>
      <button id="playBtn" class="bg-emerald-500 hover:bg-emerald-600 text-black font-bold px-6 py-2 rounded-lg transition">
        PLAY
      </button>
    </div>

    <!-- Controls Bar -->
    <div class="bg-zinc-900 p-4 rounded-xl flex items-center justify-between gap-4 mb-6 border border-zinc-800">
      <div class="flex items-center gap-2">
        <span class="text-xs text-zinc-400 font-semibold">BPM</span>
        <input id="bpmInput" type="number" value="125" class="bg-zinc-800 text-emerald-400 font-bold w-16 text-center py-1 rounded border border-zinc-700">
      </div>
      <div class="flex items-center gap-2 flex-1 max-w-[150px]">
        <span class="text-xs text-zinc-400 font-semibold">VOL</span>
        <input id="volInput" type="range" min="0" max="1" step="0.1" value="0.8" class="w-full accent-emerald-400">
      </div>
    </div>

    <!-- Channel Rack Header -->
    <div class="flex justify-between items-center mb-3">
      <span class="text-xs font-bold tracking-widest text-zinc-400">CHANNEL RACK</span>
      <span class="text-xs text-emerald-400">16 STEPS</span>
    </div>

    <!-- Sequencer Tracks Container -->
    <div id="rack" class="space-y-3"></div>
  </div>

  <!-- Footer Info -->
  <div class="text-center text-xs text-zinc-600 mt-6">
    WAVEX-STUDIO • Zero Friction Web DAW Engine
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let ctx = null;
    let isPlaying = false;
    let currentStep = 0;
    let intervalId = null;

    const tracks = [
      { name: "Kick", freq: 150, decay: 0.2, type: "sine" },
      { name: "Snare", freq: 250, decay: 0.15, type: "triangle" },
      { name: "Hi-Hat", freq: 800, decay: 0.05, type: "square" },
      { name: "Clap", freq: 400, decay: 0.1, type: "sawtooth" }
    ];

    const sequence = tracks.map(() => Array(16).fill(false));

    function initCtx() {
      if (!ctx) ctx = new AudioCtx();
      if (ctx.state === 'suspended') ctx.resume();
    }

    function playSound(trackIdx) {
      if (!ctx) return;
      const track = tracks[trackIdx];
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      const masterVol = parseFloat(document.getElementById('volInput').value);
      
      osc.type = track.type;
      osc.frequency.setValueAtTime(track.freq, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + track.decay);
      
      gain.gain.setValueAtTime(masterVol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + track.decay);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start();
      osc.stop(ctx.currentTime + track.decay);
    }

    function renderRack() {
      const rackEl = document.getElementById('rack');
      rackEl.innerHTML = '';

      tracks.forEach((track, tIdx) => {
        const row = document.createElement('div');
        row.className = 'bg-zinc-900 p-3 rounded-lg border border-zinc-800/80';
        
        const title = document.createElement('div');
        title.className = 'text-xs font-bold text-zinc-300 mb-2';
        title.innerText = track.name;
        row.appendChild(title);

        const stepsGrid = document.createElement('div');
        stepsGrid.className = 'grid grid-cols-8 gap-1.5';

        for (let sIdx = 0; sIdx < 8; sIdx++) {
          const btn = document.createElement('button');
          btn.className = `h-9 rounded border border-zinc-700 transition ${sequence[tIdx][sIdx] ? 'active-step' : 'bg-zinc-800'}`;
          if (currentStep === sIdx && isPlaying) btn.classList.add('current-step');
          
          btn.onclick = () => {
            initCtx();
            sequence[tIdx][sIdx] = !sequence[tIdx][sIdx];
            if (sequence[tIdx][sIdx]) playSound(tIdx);
            renderRack();
          };
          stepsGrid.appendChild(btn);
        }
        row.appendChild(stepsGrid);
        rackEl.appendChild(row);
      });
    }

    document.getElementById('playBtn').onclick = () => {
      initCtx();
      isPlaying = !isPlaying;
      const playBtn = document.getElementById('playBtn');

      if (isPlaying) {
        playBtn.innerText = 'STOP';
        playBtn.className = 'bg-red-500 hover:bg-red-600 text-white font-bold px-6 py-2 rounded-lg transition';
        currentStep = 0;
        runSequencer();
      } else {
        playBtn.innerText = 'PLAY';
        playBtn.className = 'bg-emerald-500 hover:bg-emerald-600 text-black font-bold px-6 py-2 rounded-lg transition';
        clearInterval(intervalId);
        renderRack();
      }
    };

    function runSequencer() {
      const bpm = parseInt(document.getElementById('bpmInput').value) || 120;
      const stepTime = (60 / bpm / 2) * 1000;

      clearInterval(intervalId);
      intervalId = setInterval(() => {
        tracks.forEach((_, tIdx) => {
          if (sequence[tIdx][currentStep]) playSound(tIdx);
        });
        renderRack();
        currentStep = (currentStep + 1) % 8;
      }, stepTime);
    }

    renderRack();
  </script>
</body>
</html>
